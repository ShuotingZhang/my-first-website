<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>

    <link rel="stylesheet" href="website.css">
</head>

<body>
    <header class="mobile-nav">
        <a href="filters.html" class="menu">
            <img src="images/menu.png" alt="filter">
        </a>

        <nav class="desktop-filter-nav">
            <a href="filters.html">STYLE</a>
            <a href="filters.html">OCCASION</a>
            <a href="filters.html">FLAVOR</a>
            <a href="filters.html">PRICE</a>
        </nav>

        <div class="nav-icons">
            <button><img src="images/search.png" alt="search"></button>
            <button><img src="images/like.png" alt="like"></button>
            <button><img src="images/cart.png" alt="cart"></button>
        </div>
    </header>

    <main class="cart-sec">
        <section class="cart-title-bar">
            <img src="images/cart.png" alt="cart">
            <h1>CART (2 Items) </h1>
        </section>

        <section class="cart-content">
            <div class="cart-items">
                <article class="cart-item">
                    <div class="cart-image-box">
                        <img src="images/2023YarraYeringDryRedNo.1CabernetBlend750ml (1).webp" alt="Yarra Yering wine">
                        <button class="cart-heart">♥</button>
                    </div>

                    <h2>2023 Yarra Yering Dry Red No. 1 Cabernet Blend 750ml</h2>

                    <div class="cart-row">
                        <div class="cart-quantity">
                            <button>-</button>
                            <p>1</p>
                            <button>+</button>
                        </div>

                        <p class="cart-price">$159</p>
                    </div>
                </article>

                <article class="cart-item">
                    <div class="cart-image-box">
                        <img src="images/2023YarraYeringDryRedNo.2 (1).webp" alt="Yarra Yering wine">
                        <button class="cart-heart">♥</button>
                    </div>

                    <h2>2023 Yarra Yering Dry Red No. 2 750ml</h2>

                    <div class="cart-row">
                        <div class="cart-quantity">
                            <button>-</button>
                            <p>1</p>
                            <button>+</button>
                        </div>

                        <p class="cart-price">$109</p>
                    </div>
                </article>
            </div>

            <aside class="cart-summary">
                <p class="cart-total">TOTAL $268</p>
                <a href="checkout.html" class="checkout-btn">CHECK OUT</a>
            </aside>
        </section>
    </main>
    <script src="cart.js"></script>
    <footer class="footer-logo">
            <a href="index.html">
            <img src="images/logo.png" alt="JC Fine Wines logo">
            </a>
        </footer>
</body>
</html>
