<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picks For You - Results</title>

    <!-- Kalnia font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@100..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="website.css">
</head>

<body>
    <header class="mobile-nav">
        <button class="menu">
            <img src="images/menu.png" alt="menu">
        </button>

        <div class="nav-icons">
            <button>
                <img src="images/search.png" alt="search">
            </button>
            <button>
                <img src="images/like.png" alt="like">
            </button>
            <button>
                <img src="images/cart.png" alt="cart">
            </button>
        </div>
    </header>

    <main class="results-sec">
        <section class="picks-banner">
            <img src="images/thumb.png" alt="thumb up">
            <h1>PICKS FOR YOU</h1>
        </section>

        <h2>Your picks: 2 items</h2>

        <section class="product-grid">
            <article class="product-card">
                <div class="product-image-box">
                    <a href="product-detail.html">
                        <img src="images/2023YarraYeringDryRedNo.2 (1).webp" alt="Yarra Yering Dry Red Wine">
                    </a>
                </div>

                <div class="product-info">
                    <button class="heart-btn">♥</button>

                    <h3>2023 Yarra Yering Dry Red No. 2 750ml</h3>

                    <div class="tag-row">
                        <span>Red</span>
                        <span>Dinner</span>
                        <span>Bold...</span>
                    </div>

                    <div class="quantity-row">
                        <button>-</button>
                        <p>1</p>
                        <button>+</button>
                    </div>

                    <p class="price">$109</p>

                    <a href="cart.html" class="add-cart-btn">ADD TO CART</a>
                </div>
            </article>

            <article class="product-card">
                <div class="product-image-box">
                    <a href="product-detail1.html">
                        <img src="images/2023YarraYeringDryRedNo.1CabernetBlend750ml (1).webp" alt="Yarra Yering Dry Red Wine">
                    </a>
                </div>

                <div class="product-info">
                    <button class="heart-btn">♥</button>

                    <h3>2023 Yarra Yering Dry Red No. 1 Cabernet Blend 750ml</h3>

                    <div class="tag-row">
                        <span>Red</span>
                        <span>Dinner</span>
                        <span>Bold...</span>
                    </div>

                    <div class="quantity-row">
                        <button>-</button>
                        <p>1</p>
                        <button>+</button>
                    </div>

                    <p class="price">$159</p>

                    <a href="cart.html" class="add-cart-btn">ADD TO CART</a>
                </div>
            </article>
        </section>
    </main>

    <footer class="footer-logo">
        <a href="index.html">
        <img src="images/logo.png" alt="JC Fine Wines logo">
        </a>
    </footer>
    <script src="results.js"></script>
</body>
</html>
