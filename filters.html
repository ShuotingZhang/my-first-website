<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters</title>

    <!-- Kalnia font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@100..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="website.css">
</head>

<body>
    <header class="mobile-nav">
        <a href="filters.html" class="menu">
            <img src="images/menu.png" alt="filter">
        </a>

        <nav class="desktop-filter-nav">
            <a href="#">STYLE</a>
            <a href="#">OCCASION</a>
            <a href="#">FLAVOR</a>
            <a href="#">PRICE</a>
        </nav>

        <div class="nav-icons">
            <button>
                <img src="images/search.png" alt="search">
            </button>
            <button>
                <img src="images/like.png" alt="like">
            </button>
            <a href="cart.html" class="cart-icon">
                <img src="images/cart.png" alt="cart">
            </a>
        </div>
    </header>

    <main class="filters-sec">
        <section class="filter-title-bar">
            <img src="images/filter.svg" alt="filter">
            <h1>FILTERS</h1>
        </section>

        <section class="filter-panel">
            <div class="filter-group">
                <h2>STYLE</h2>

                <div class="filter-options">
                    <button>Red</button>
                    <button>White</button>
                    <button>Rose</button>
                    <button>Sparkling</button>
                    <button>Others</button>
                </div>
            </div>

            <div class="filter-group">
                <h2>OCCASION</h2>

                <div class="filter-options">
                    <button>Dinner</button>
                    <button>Celebrating</button>
                    <button>Relaxing</button>
                    <button>Gift</button>
                </div>
            </div>

            <div class="filter-group">
                <h2>FLAVOR</h2>

                <div class="filter-options">
                    <button>Sweet</button>
                    <button>Dry & refined</button>
                    <button>Fruity</button>
                    <button>Bold & intense</button>
                </div>
            </div>

            <div class="filter-group">
                <h2>PRICE</h2>

                <div class="price-line">
                    <div class="price-point">
                        <span></span>
                        <p>50</p>
                    </div>

                    <div class="price-point">
                        <span></span>
                        <p>100</p>
                    </div>

                    <div class="price-point">
                        <span></span>
                        <p>200</p>
                    </div>
                </div>
            </div>

            <div class="filter-actions">
                <a href="filters.html" class="reset-btn">RESET</a>
                <a href="picks-results.html" class="apply-btn">APPLY</a>
            </div>
        </section>
    </main>

    <footer class="footer-logo">
            <a href="index.html">
            <img src="images/logo.png" alt="JC Fine Wines logo">
            </a>
    </footer>
    <script src="filters.js"></script>
</body>
</html>
